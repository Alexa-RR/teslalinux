# teslalinux hotspot DHCP + DNS (rendered by host/teslalinux-render). The address= set is upstream's
# netd TetherController patch series, final state after 0001-0005
# (upstream/android-raspberry-pi/patches-aosp/system/netd/), with our hostname and hijack IP.
interface=@AP_IFACE@
bind-interfaces
except-interface=lo
no-resolv
server=1.1.1.1
server=8.8.8.8
dhcp-range=@AP_SUBNET@.50,@AP_SUBNET@.150,255.255.255.0,24h
dhcp-option=option:router,@AP_SUBNET@.1
dhcp-option=option:dns-server,@AP_SUBNET@.1
dhcp-authoritative
dhcp-rapid-commit
cache-size=1000
log-dhcp

# The device hostnames resolve to the hijack IP that nftables redirects to this Pi (0001).
@HOST_ADDRESSES@

# Fullscreen trick: the car opens youtu.be in theater mode; nftables DNATs this IP:6969 -> Pi:80 (0002).
address=/youtu.be/216.58.215.78
address=/www.youtu.be/216.58.215.78

# Offline mode and its telemetry / firmware-download switches (0001, 0004, 0005).
@OFFLINE_BLOCK@
