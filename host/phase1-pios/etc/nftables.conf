#!/usr/sbin/nft -f
# teslalinux: hotspot NAT and the public-IP hijack the car browser uses (rendered by
# host/teslalinux-render). The rules are upstream's netd iptables, 1:1
# (upstream/android-raspberry-pi/patches-aosp/system/netd/0001 and 0002).
# Only our own table is replaced (no `flush ruleset`): other tables (a VPN's, a firewall's) stay. The
# empty declaration first makes the delete work when the table does not exist yet (first load), on
# every nft version (`destroy table` needs nftables 1.0.8 / Linux 6.3).
table ip teslalinux
delete table ip teslalinux

table ip teslalinux {
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    # 0001: everything the car sends to the hijack IP goes to this Pi (tcp and udp)
    iifname "@AP_IFACE@" ip daddr @HIJACK_IP@ meta l4proto { tcp, udp } dnat to @AP_SUBNET@.1
    # 0002: youtu.be fullscreen trick, :6969 on the spoofed YouTube IP -> the Pi's :80
    iifname "@AP_IFACE@" ip daddr 216.58.215.78 tcp dport 6969 dnat to @AP_SUBNET@.1:80
    iifname "@AP_IFACE@" ip daddr 216.58.215.78 udp dport 6969 dnat to @AP_SUBNET@.1:80
  }
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    # 0001/0002: connections this Pi opens towards the car carry the hijack identity. Replies to
    # the car's own connections are reverse-translated by conntrack already; these rules only
    # matter for new connections from the Pi, exactly as upstream's SNAT rules.
    # Same order as upstream's rule list: the hijack SNAT comes first, so the youtu.be SNAT after it
    # never matches there either; kept for parity.
    oifname "@AP_IFACE@" ip saddr @AP_SUBNET@.1 meta l4proto { tcp, udp } snat to @HIJACK_IP@
    oifname "@AP_IFACE@" ip saddr @AP_SUBNET@.1 tcp dport 80 snat to 216.58.215.78:6969
    oifname "@AP_IFACE@" ip saddr @AP_SUBNET@.1 udp dport 80 snat to 216.58.215.78:6969
    # internet for the car through whatever uplink exists (LTE stick, ethernet, tether): Android's
    # tethering NAT upstream
    ip saddr @AP_SUBNET@.0/24 oifname != "@AP_IFACE@" masquerade
  }
  chain forward {
    type filter hook forward priority filter; policy accept;
  }
}
