# teslalinux front door (rendered by host/teslalinux-render): upstream's lighttpd.conf
# (upstream/android-vendor-tesla-android/services/lighttpd/lighttpd.conf) in nginx, server by server.
# Included inside http{} (Alpine: /etc/nginx/http.d/, Pi OS: sites-enabled/). The variable and the
# session cache zone carry a teslalinux prefix so they never clash with the distribution nginx.conf
# (Alpine's defines $connection_upgrade and ssl_session_cache shared:SSL:2m at http level).

map $http_upgrade $tl_connection_upgrade { default upgrade; '' close; }

# lighttpd.conf:13-14,18,27-29,53-63 base server: any other host on :80 and :443 gets the static frontend with
# no extra headers and no proxies. This includes www.teslamotors.com, www.tesla.com, www.tesla.cn
# (offline mode, dnsmasq points them here).
server {
  listen @HTTP_PORT@ default_server;
  listen @HTTPS_PORT@ ssl default_server;
  server_name _;
  include @NGINX_DIR@/teslalinux-tls.inc;
  include @NGINX_DIR@/teslalinux-static.inc;
}

# lighttpd.conf:131-144 offline mode: Tesla's connectivity probes get the frontend plus these headers.
server {
  listen @HTTP_PORT@;
  listen @HTTPS_PORT@ ssl;
  server_name connman.vn.tesla.services connman.vn.cloud.tesla.cn;
  include @NGINX_DIR@/teslalinux-tls.inc;
  add_header X-ConnMan-Status online always;
  add_header X-Cache "Hit from cloudfront" always;
  include @NGINX_DIR@/teslalinux-static.inc;
}

# lighttpd.conf:126-129 fullscreen launcher: youtu.be (DNAT 216.58.215.78:6969 -> :80) serves the
# redirect page, which sends the browser on to https://fullscreen.@DEVICE_HOST@ after 3 s.
server {
  listen @HTTP_PORT@;
  server_name youtu.be www.youtu.be;
  root @REDIRECT_ROOT@;
  index index.html;
  include @NGINX_DIR@/teslalinux-mime.inc;
  error_page 404 /404.html;
  location = /404.html { root @WEB_ROOT@; }
  location / { try_files $uri $uri/ =404; }
}

# lighttpd.conf:65-124 the app: our hostname, its www./fullscreen./www.fullscreen. names, and
# private-range IP literals (upstream's host regex matches teslaandroid.com hosts and
# 192.168/10/172.16-31 addresses). Same headers, proxies and caching on :443 and :80 like upstream
# (on plain http the browser withholds the secure-context APIs; the car uses https).
server {
  listen @HTTPS_PORT@ ssl;
  http2 on;
  server_name @DEVICE_HOST@ *.@DEVICE_HOST@
    "~^(192\.168\.[0-9]{1,3}\.[0-9]{1,3}|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9]{1,3}\.[0-9]{1,3})$";
  include @NGINX_DIR@/teslalinux-tls.inc;
  include @NGINX_DIR@/teslalinux-app.inc;
}
server {
  listen @HTTP_PORT@;
  server_name @DEVICE_HOST@ *.@DEVICE_HOST@
    "~^(192\.168\.[0-9]{1,3}\.[0-9]{1,3}|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9]{1,3}\.[0-9]{1,3})$";
  include @NGINX_DIR@/teslalinux-app.inc;
}
