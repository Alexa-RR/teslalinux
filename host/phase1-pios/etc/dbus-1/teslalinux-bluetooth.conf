<!-- teslalinux: what the app user (tesla) may ask bluetoothd (org.bluez) on the system bus.
     The apps' Bluetooth (ATL's android.bluetooth over BlueZ) only scans for LE advertisements,
     Waze's tunnel beacons: it reads BlueZ's objects and properties and runs a discovery session
     (SetDiscoveryFilter, StartDiscovery, StopDiscovery). Everything else (powering the adapter,
     pairing, connecting, advertising, agents, profiles) is denied to tesla, although BlueZ's own
     bluetooth.conf lets every user send to org.bluez. Installed as
     /etc/dbus-1/system.d/teslalinux-bluetooth.conf by tools/pios/install.sh. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="tesla">
    <deny send_destination="org.bluez"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.ObjectManager" send_member="GetManagedObjects"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Adapter1" send_member="SetDiscoveryFilter"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Adapter1" send_member="GetDiscoveryFilters"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Adapter1" send_member="StartDiscovery"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Adapter1" send_member="StopDiscovery"/>
  </policy>
</busconfig>
