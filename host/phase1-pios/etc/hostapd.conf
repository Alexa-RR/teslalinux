# teslalinux hotspot (rendered by host/teslalinux-render from /etc/teslalinux/env and the frontend's
# Wi-Fi settings: persist.tesla-android.softap.band_type/channel/channel_width, applied at boot like
# upstream's TeslaAndroidSoftApConfiguration in the Wi-Fi stack).
interface=@AP_IFACE@
driver=nl80211
ssid=@AP_SSID@
country_code=@AP_COUNTRY@
ieee80211d=1
hw_mode=@HW_MODE@
channel=@CHANNEL@
ieee80211n=1
@BAND_LINES@
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=@AP_PSK@
# Don't wait for a scan / ACS, start beaconing immediately.
ignore_broadcast_ssid=0
beacon_int=100
# Keep the car's association alive across short dropouts.
ap_max_inactivity=600
skip_inactivity_poll=1
