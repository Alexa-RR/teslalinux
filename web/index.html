<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Teslalinux</title>
  <link rel="icon" type="image/png" href="./assets/teslalinux-logo.png" />
  <link rel="shortcut icon" type="image/png" href="./assets/teslalinux-logo.png" />
  <link rel="apple-touch-icon" href="./assets/teslalinux-logo.png" />

  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/settings.css" />

  <!-- teslalinux: Settings > This device > Debug, the Model 3 screen emulator (emulate.html); first and not deferred -->
  <script src="./js/core/screen-emulation.js"></script>

  <script defer src="./js/vendor/reconnecting/reconnecting-websocket.js"></script>
  <script defer src="./js/gps/estimator.js"></script>
  <script defer src="./js/audio/audioplayback.js"></script>

  <script defer src="./js/core/shared.js"></script>
  <script defer src="./js/core/api-client.js"></script>
  <script defer src="./js/display/display-renderer-manager.js"></script>
  <script defer src="./js/display/display-controller.js"></script>
  <!-- teslalinux: the app's start over the display (README.teslalinux.md) -->
  <script defer src="./js/display/app-state-overlay.js"></script>
  <script defer src="./js/touchscreen/touchscreen-controller.js"></script>
  <script defer src="./js/gps/gps-controller.js"></script>
  <script defer src="./js/speech/speech.js"></script>
  <script defer src="./js/audio/audio-controller.js"></script>
  <script defer src="./js/settings/settings-ui.js"></script>
  <!-- teslalinux: PalGate gates (the map button, its tray and notices; Settings > Gates; README.teslalinux.md) -->
  <link rel="stylesheet" href="./js/gates/gates.css" />
  <script defer src="./js/gates/gates-controller.js"></script>
  <script defer src="./js/settings/settings-gates.js"></script>
  <!-- teslalinux: the car's own link over Bluetooth (Settings > Tesla; docs/TESLA-LINK.md) -->
  <script defer src="./js/settings/settings-tesla.js"></script>
  <!-- teslalinux: Grok remote control (Settings > Grok; docs/GROK.md) -->
  <script defer src="./js/settings/settings-grok.js"></script>
  <script defer src="./js/settings/settings-controller.js"></script>
  <script defer src="./js/home/home-controller.js"></script>
  <script defer src="./js/shell/shell-controller.js"></script>
  <script defer src="./js/core/app.js"></script>
  <!-- teslalinux: certificate notice (README.teslalinux.md) -->
  <script defer src="./js/core/cert-warning.js"></script>
  <!-- teslalinux: the app's car interface (Settings > Waze interface: Car; README.teslalinux.md) -->
  <link rel="stylesheet" href="./js/carapp/carapp.css" />
  <script defer src="./js/carapp/carapp-renderer.js"></script>
  <script defer src="./js/carapp/carapp-speedometer.js"></script>
  <script defer src="./js/carapp/carapp-controller.js"></script>
  <script defer src="./js/carapp/carapp-settings-view.js"></script>
  <!-- teslalinux: the device keyboard (Settings > Keyboard, README.teslalinux.md) -->
  <script defer src="./js/keyboard/device-keyboard.js"></script>
</head>
<body>
  <div id="connectivity-banner" hidden role="status" aria-live="polite">
    <span class="material-symbols-rounded connectivity-banner-icon">wifi_off</span>
    <span id="connectivity-banner-text">
      Connection with Teslalinux services lost. The app will restart when it comes back.
    </span>
  </div>

  <section id="home-shell">
    <div id="home-stage" aria-label="Teslalinux virtual display">
      <div id="display-root">
        <img id="image" alt="" />
        <canvas id="canvas"></canvas>
        <div id="touch-layer" aria-hidden="true"></div>
      </div>
      <div id="display-loading" aria-live="polite" aria-label="Loading display" hidden>
        <svg class="loading-spinner" viewBox="0 0 66 66" role="presentation" aria-hidden="true">
          <circle class="loading-spinner-circle" cx="33" cy="33" r="28"></circle>
        </svg>
      </div>

      <div id="home-controls">
        <button id="home-audio-button" class="home-control-button" type="button" title="Toggle audio">
          <span class="material-symbols-rounded home-control-icon">volume_off</span>
        </button>
        <!-- teslalinux: PalGate gates (js/gates/gates-controller.js); shown once gates are linked and shown -->
        <button id="home-gates-button" class="home-control-button" type="button" title="Gates" aria-label="Gates" hidden>
          <span class="material-symbols-rounded home-control-icon" aria-hidden="true">garage</span>
        </button>
        <button id="home-update-button" class="home-control-button update" type="button" title="Open updater" hidden>
          <span class="material-symbols-rounded home-control-icon">download</span>
        </button>
        <!-- "tune", not a gear: Waze's car interface has its own settings gear among its map buttons -->
        <button id="home-settings-button" class="home-control-button" type="button" title="Settings" aria-label="Settings">
          <span class="material-symbols-rounded home-control-icon" aria-hidden="true">tune</span>
        </button>
      </div>
    </div>
  </section>

  <!-- teslalinux: the settings page, the page's only one besides the map (css/settings.css, js/settings/;
       README.teslalinux.md): the map's settings button opens it, its "Map" button goes back -->
  <section id="page-settings" hidden>
    <div class="st-app" id="settings-app" data-view="section">
      <header class="bar">
        <button class="bar-back" id="settings-back" type="button"><span class="icon flip" aria-hidden="true">chevron_left</span><span>Map</span></button>
        <h1 class="bar-title" id="settings-title">Settings</h1>
        <div class="bar-end">
          <span class="bar-state" id="settings-bar-state" role="status"><span class="spin"></span><span id="settings-bar-state-text">Waze is restarting</span></span>
          <label class="search" id="settings-search"><span class="icon" aria-hidden="true">search</span><input id="settings-search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Search settings" aria-label="Search settings" /><button class="search-clear" id="settings-search-clear" type="button" aria-label="Clear"><span class="icon" aria-hidden="true">close</span></button></label>
        </div>
        <div class="busyline" id="settings-busyline"></div>
      </header>
      <nav class="rail" id="settings-sidebar" aria-label="Settings sections"></nav>
      <main class="pane" id="settings-pane"><div class="content" id="settings-content"></div></main>
    </div>
  </section>
</body>
</html>
