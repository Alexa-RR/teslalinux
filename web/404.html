<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found</title>
  <style>
    :root { --text: #1b1b1b; --bg: #f8f8f8; --link: #c62828; }
    @media (prefers-color-scheme: dark) { :root { --text: #f1f1f1; --bg: #303030; --link: #ff8a80; } }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 12px; background: var(--bg); color: var(--text);
           font-family: Roboto, Arial, sans-serif; }
    h1 { font-size: 1.4em; margin: 0; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <!-- teslalinux: the 404 page nginx serves (upstream lighttpd.conf:14 server.error-handler-404) -->
  <h1>Page not found</h1>
  <a href="/">Back to the app</a>
</body>
</html>
